<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./public/favicon.ico">
    <title>WackyWiki</title>
    <link rel="stylesheet" href="./src/login.css">
  </head>
  <body>
    <div class="loginwindow">
      <div class="bigwindow">
        <div class="smallerwindow">
          <div class="leftbit">
            <br>
            <h1>Welcome to WackyWiki!</h1>
            <br>
            <p>Passwords must:
            <ul style="text-align:left">
              <li>Be at least 8 characters long</li>
              <li>Contain at least one capital letter</li>
              <li>Contain at least one number</li>
            </ul></p>
            <br>
            <p>
            Already have an account?
            <a href="/login">Log In</a>
            <br>
            <br>
            <a href="/">Back Home</a>
            </p>
          </div>
          <div class="rightbit">
            <input id="namebox" type="text" placeholder="Username">
            <input id="passbox" type="password" placeholder="Password">
            <button id="loginbutton">Create Account</button>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script type="module" src="./src/signup.js"></script>
</html>
